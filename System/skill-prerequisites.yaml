# ────────────────────────────────────────────────────────────
# USE CASES — prioritisés en phase 0
# ────────────────────────────────────────────────────────────

use_cases:
  - id: pipeline-prep
    name: "Pilotage du pipeline & prep RDV (rituel vendredi 16h)"
    skills: [friday-close, prep-meeting, pipeline-monitor]
    minimum_thematics: [crm, calendar]
    recommended_thematics: [email, chat]

  - id: coaching-sales
    name: "Coaching sales (toi + équipe)"
    skills: [coach-sales-self, coach-team-member]
    minimum_thematics: [crm]
    recommended_thematics: [transcript, chat]

  - id: support-client
    name: "Drafts support client automatisés"
    skills: [draft-support-reply]
    minimum_thematics: [email]
    recommended_thematics: [docs]

  - id: all-hands
    name: "Prep all-hands mensuel"
    skills: [all-hands, publish-sop, sync-cowork]
    minimum_thematics: [docs]
    recommended_thematics: [crm, analytics, project]

  - id: roadmap-produit
    name: "Roadmap produit, specs & maquettes"
    skills: [roadmap-sync, spec-audit, mockup-from-repo]
    minimum_thematics: [project]
    recommended_thematics: [docs, code]

  - id: rituels-perso
    name: "Pilotage perso (daily, weekly, quarterly)"
    skills: [daily-plan, daily-review, week-plan, week-review, meeting-prep, process-meetings, triage, quarter-plan, quarter-review]
    minimum_thematics: [calendar]
    recommended_thematics: [email, project, chat]

  - id: board-fundraising
    name: "Board, exec summary, fundraising"
    skills: [board-prep, exec-summary, fundraising-tracker]
    minimum_thematics: [crm]
    recommended_thematics: [analytics, docs]

  - id: intelligence-externe
    name: "Prep contacts externes (meetings, prospects, investisseurs)"
    skills: [people-intel, prep-meeting, competitor-watch]
    minimum_thematics: [email]
    recommended_thematics: [calendar, crm]

  - id: knowledge-management
    name: "SOPs partagés, contexte COMEX synchronisé"
    skills: [publish-sop, sync-cowork, context-cards, drift-detection]
    minimum_thematics: [docs]
    recommended_thematics: [chat]

  - id: advisory
    name: "Diagnostic ops (pour ta boîte ou pour conseiller)"
    skills: [operating-rhythm-audit, health-score-builder, drift-detection]
    minimum_thematics: []
    recommended_thematics: [crm, calendar, project]


# ────────────────────────────────────────────────────────────
# NOTIFICATION SYMBOLS — utilisés partout
# ────────────────────────────────────────────────────────────

symbols:
  activated: "✅"   # tout prêt, skill actif
  pending:   "⏳"   # au moins un required en attente
  todo:      "🔘"   # rien n'est connecté
  dormant:   "🔒"   # skill non sélectionné par l'utilisateur en phase 0
  in_progress: "🔵" # action en cours (connexion outil, scan…)
