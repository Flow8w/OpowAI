# OpowAI — Skill prerequisites
# Cerveau de l'activation just-in-time : pour chaque skill, quels outils sont nécessaires
# Format : required (bloquant) / optional (enrichit mais pas bloquant) / unlocked (sans dépendance)
#
# Légende statuts d'activation :
# ✅ activated   — skill prêt + agent programmé si applicable
# ⏳ pending     — au moins un required en attente de connexion
# 🔘 todo        — aucun prérequis connecté
# 🔒 dormant     — skill non sélectionné par l'utilisateur en phase 0

# ────────────────────────────────────────────────────────────
# THÉMATIQUES — ordre fixe v0.1 (par valeur pour founder/COMEX)
# ────────────────────────────────────────────────────────────

thematics:
  - id: crm
    order: 1
    name: "CRM & Sales"
    description: "Le cœur commercial — pipeline, deals, contacts, deals lost"
    tools:
      - { id: pipedrive, name: "Pipedrive", popular: true }
      - { id: hubspot, name: "HubSpot", popular: true }
      - { id: salesforce, name: "Salesforce" }
      - { id: close, name: "Close" }
      - { id: attio, name: "Attio" }
      - { id: folk, name: "Folk" }
      - { id: other, name: "Autre / Mon outil n'est pas listé" }
    why_matters: "Sans CRM connecté, pas de prep RDV, pas de récap pipeline, pas de board prep."

  - id: email
    order: 2
    name: "Email"
    description: "Ta boîte mail — drafts support, intel contacts, historique"
    tools:
      - { id: gmail, name: "Gmail", popular: true }
      - { id: outlook, name: "Outlook" }
      - { id: front, name: "Front" }
      - { id: hey, name: "Hey" }
      - { id: superhuman, name: "Superhuman" }
      - { id: other, name: "Autre" }
    why_matters: "Sans email connecté, pas de drafts support, pas d'enrichissement contacts."

  - id: calendar
    order: 3
    name: "Calendar & Scheduling"
    description: "Ton calendrier — base du daily plan, prep meetings J-1, all-hands schedule"
    tools:
      - { id: gcal, name: "Google Calendar", popular: true }
      - { id: outlook-cal, name: "Outlook Calendar" }
      - { id: calendly, name: "Calendly", note: "Booking, complémentaire" }
      - { id: cal-com, name: "Cal.com" }
      - { id: other, name: "Autre" }
    why_matters: "Sans calendar, pas de daily plan, pas de prep meeting."

  - id: docs
    order: 4
    name: "Knowledge & docs"
    description: "Ta base documentaire — SOPs, OKRs, all-hands, glossaire interne"
    tools:
      - { id: notion, name: "Notion", popular: true }
      - { id: confluence, name: "Confluence" }
      - { id: coda, name: "Coda" }
      - { id: obsidian, name: "Obsidian" }
      - { id: slite, name: "Slite" }
      - { id: other, name: "Autre" }
    why_matters: "Sans Notion (ou équivalent), pas de SOPs canoniques, pas de page all-hands."

  - id: chat
    order: 5
    name: "Communication (chat)"
    description: "Tes canaux async — contexte équipe, vocabulaire interne"
    tools:
      - { id: slack, name: "Slack", popular: true }
      - { id: teams, name: "Microsoft Teams" }
      - { id: discord, name: "Discord" }
      - { id: other, name: "Autre" }
    why_matters: "Sans chat, le coaching sales et les notifications agents perdent un canal clé."

  - id: project
    order: 6
    name: "Project & Roadmap"
    description: "Ta roadmap produit — tickets, sprint, projets en cours / en retard"
    tools:
      - { id: linear, name: "Linear", popular: true }
      - { id: jira, name: "Jira", popular: true }
      - { id: notion-projects, name: "Notion projects" }
      - { id: asana, name: "Asana" }
      - { id: clickup, name: "ClickUp" }
      - { id: shortcut, name: "Shortcut" }
      - { id: other, name: "Autre" }
    why_matters: "Sans project mgmt, pas de section roadmap dans le all-hands."

  - id: analytics
    order: 7
    name: "Data & Analytics"
    description: "Tes chiffres — MRR, churn, acquisition, retention, KPIs all-hands"
    tools:
      - { id: posthog, name: "Posthog", popular: true }
      - { id: amplitude, name: "Amplitude" }
      - { id: mixpanel, name: "Mixpanel" }
      - { id: stripe, name: "Stripe", note: "Pour MRR / churn $" }
      - { id: metabase, name: "Metabase" }
      - { id: looker, name: "Looker" }
      - { id: ga4, name: "Google Analytics 4" }
      - { id: db-custom, name: "Base de données custom (MCP)" }
      - { id: other, name: "Autre" }
    why_matters: "Sans data, les KPIs du all-hands sont à remplir à la main."

  - id: transcript
    order: 8
    name: "Transcript & meeting recording"
    description: "Tes transcripts de calls — base du coaching sales et de la capture meeting"
    tools:
      - { id: granola, name: "Granola", popular: true }
      - { id: gong, name: "Gong" }
      - { id: fireflies, name: "Fireflies" }
      - { id: otter, name: "Otter.ai" }
      - { id: tactiq, name: "Tactiq" }
      - { id: loom, name: "Loom" }
      - { id: other, name: "Autre" }
    why_matters: "Sans transcripts, pas de coaching sales automatique, pas d'analyse récurrente des calls."

  - id: code
    order: 9
    name: "Code & Dev"
    description: "Ton repo — pour les founders techniques, mockups depuis design system"
    optional: true
    tools:
      - { id: github, name: "GitHub", popular: true }
      - { id: gitlab, name: "GitLab" }
      - { id: bitbucket, name: "Bitbucket" }
      - { id: other, name: "Autre" }
    why_matters: "Optionnel. Active la génération de maquettes alignées au design system existant."

  - id: other
    order: 10
    name: "Autre — connecteur libre"
    description: "Un outil interne, un MCP custom, un service spécifique à ta boîte"
    free_form: true
    tools: []
    why_matters: "Pour les boîtes avec des outils niche ou propriétaires."


